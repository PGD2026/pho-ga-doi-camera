
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phở Gà Đồi Camera V3.1</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  background: #151515;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

header {
  background: #941c1c;
  color: #f4e5a4;
  padding: 22px;
  border-radius: 12px;
  text-align: center;
}

h1 { margin: 0; }
h3 { color: #f4e5a4; }

section {
  background: #242424;
  padding: 15px;
  border-radius: 12px;
  margin-top: 15px;
}

label {
  display: block;
  margin: 12px 0 6px;
}

input, select {
  width: 100%;
  padding: 13px;
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 15px;
  background: #941c1c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

button:disabled { opacity: .45; }

[hidden] { display: none !important; }

.secondary { background: #555; }
.green { background: #21864b; }

.progress {
  height: 8px;
  background: #444;
  border-radius: 10px;
  overflow: hidden;
}

#bar {
  height: 100%;
  width: 0;
  background: #35b76b;
  transition: width .2s;
}

.task {
  padding: 13px 0;
  border-bottom: 1px solid #444;
  display: flex;
  align-items: center;
  gap: 10px;
}

.task span { flex: 1; }
.done { color: #63d991; }
.current { color: #f4e5a4; }

.task button {
  width: auto;
  padding: 8px;
  margin: 0;
  font-size: 12px;
}

.camera {
  position: relative;
  background: black;
  border-radius: 10px;
  overflow: hidden;
}

video, canvas {
  width: 100%;
  display: block;
}

.watermark {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 12px;
  background: rgba(0,0,0,.65);
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

#capture {
  display: block;
  width: 76px;
  height: 76px;
  background: white;
  border: 6px solid #888;
  border-radius: 50%;
  margin: 18px auto;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.photo {
  background: #333;
  border-radius: 8px;
  padding: 8px;
  font-size: 13px;
}

.photo img {
  width: 100%;
  border-radius: 6px;
}

#status {
  color: #f4e5a4;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>

<body>
<main>

<header>
  <h1>PHỞ GÀ ĐỒI</h1>
  <p>ngon từ gà</p>
  <b>CAMERA NGHIỆM THU V3.1</b>
</header>

<section>
  <h3>1. THÔNG TIN NHÂN VIÊN</h3>

  <label>Cơ sở cửa hàng</label>
  <select id="branch">
    <option value="">Chọn cơ sở</option>
    <option>28 Võ Chí Công</option>
    <option>An Khánh</option>
  </select>

  <label>Họ và tên</label>
  <input id="staff"
    maxlength="60"
    placeholder="Nhập họ và tên">

  <button id="begin" onclick="beginReport()">
    BẮT ĐẦU NGHIỆM THU
  </button>
</section>

<section id="workflow" hidden>

  <h3>2. TIẾN ĐỘ NGHIỆM THU</h3>

  <p id="progressText">0/8 ảnh</p>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="tasks"></div>

  <button id="openNext" onclick="openNext()">
    MỞ CAMERA
  </button>

</section>

<section id="cameraSection" hidden>

  <h3 id="areaTitle"></h3>

  <div class="camera">

    <video id="video"
      autoplay playsinline muted hidden>
    </video>

    <canvas id="canvas" hidden></canvas>

    <div id="watermark"
      class="watermark" hidden>

      <b style="color:#f4e5a4">
        PHỞ GÀ ĐỒI
      </b>

      <div id="liveInfo"></div>
      <div id="clock"></div>

    </div>
  </div>

  <button id="capture"
    aria-label="Chụp ảnh"
    onclick="takePhoto()" hidden>
  </button>

  <div id="review" hidden>

    <button class="green"
      onclick="confirmPhoto()">
      XÁC NHẬN ẢNH
    </button>

    <button class="secondary"
      onclick="startCamera()">
      CHỤP LẠI
    </button>

  </div>

  <button id="retry"
    onclick="startCamera()" hidden>
    THỬ MỞ CAMERA LẠI
  </button>

  <button class="secondary"
    onclick="cancelCamera()">
    QUAY LẠI DANH SÁCH
  </button>

</section>

<section id="gallerySection" hidden>

  <h3>3. HÌNH ẢNH ĐÃ CHỤP</h3>

  <div id="gallery" class="gallery"></div>

</section>

<section id="finishSection" hidden>

  <h3>HOÀN THÀNH 8/8 ẢNH</h3>

  <p>
    Vui lòng kiểm tra lại toàn bộ
    hình ảnh nghiệm thu.
  </p>

  <button class="green"
    onclick="finishReport()">
    XÁC NHẬN HOÀN THÀNH
  </button>

</section>

<p id="status" role="status"></p>

</main>

<script>

const $ = id => document.getElementById(id);

const areas = [
  "Khu vực làm phở",
  "Khu vực bếp",
  "Tủ bảo quản",
  "Khu vực khách ngồi",
  "Nhà vệ sinh",
  "Khu vực rác",
  "Điện và gas",
  "Khóa cửa hàng"
];

const photos = Array(8).fill(null);

let stream = null;
let current = 0;
let temporaryPhoto = null;
let opening = false;
let cameraRequest = 0;
let branch = "";
let staff = "";
let reportId = "";

function getTime() {

  return new Intl.DateTimeFormat("vi-VN", {
    timeZone: "Asia/Ho_Chi_Minh",
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).format(new Date());

}

setInterval(() => {
  $("clock").textContent = getTime();
}, 500);

function beginReport() {

  branch = $("branch").value;
  staff = $("staff").value.trim();

  if (!branch || !staff) {

    $("status").textContent =
      "Vui lòng nhập đầy đủ thông tin.";

    return;
  }

  reportId = crypto.randomUUID();

  $("branch").disabled = true;
  $("staff").disabled = true;
  $("begin").hidden = true;
  $("workflow").hidden = false;

  refresh();

  $("status").textContent =
    "Bắt đầu chụp ảnh nghiệm thu.";

}

function refresh() {

  const count = photos.filter(Boolean).length;

  $("progressText").textContent =
    count + "/8 ảnh";

  $("bar").style.width =
    (count / 8 * 100) + "%";

  $("tasks").innerHTML = areas.map((a, i) => `
    <div class="task">

      <b class="${photos[i] ? "done" : ""}">
        ${photos[i] ? "✓" : "○"}
      </b>

      <span>${i + 1}. ${a}</span>

      ${photos[i]
        ? `<button class="secondary"
             onclick="openArea(${i})">
             Chụp lại
           </button>`
        : `<small>Chưa chụp</small>`
      }

    </div>
  `).join("");

  $("gallery").innerHTML = photos.map((p, i) =>
    p ? `
      <div class="photo">
        <img src="${p}">
        <p>${i + 1}. ${areas[i]}</p>
      </div>
    ` : ""
  ).join("");

  $("gallerySection").hidden = count === 0;
  $("finishSection").hidden = count !== 8;
  $("openNext").hidden = count === 8;

  $("openNext").textContent =
    "CHỤP ẢNH " + (count + 1) + "/8";

}

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(t => t.stop());

    stream = null;

  }

  $("video").srcObject = null;

}

function openNext() {

  const next = photos.findIndex(p => !p);

  if (next !== -1) {
    openArea(next);
  }

}

function openArea(i) {

  current = i;
  temporaryPhoto = null;

  $("cameraSection").hidden = false;
  $("finishSection").hidden = true;
  $("areaTitle").textContent =
    (i + 1) + "/8 - " + areas[i];

  $("cameraSection").scrollIntoView({
    behavior: "smooth"
  });

  startCamera();

}

async function startCamera() {

  if (opening) return;

  opening = true;

  const request = ++cameraRequest;

  stopCamera();

  temporaryPhoto = null;

  $("review").hidden = true;
  $("canvas").hidden = true;
  $("capture").hidden = true;
  $("retry").hidden = true;

  try {

    if (!navigator.mediaDevices?.getUserMedia) {

      throw new Error(
        "Trình duyệt không hỗ trợ camera"
      );

    }

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },

        audio: false

      });

    if (request !== cameraRequest) {

      newStream.getTracks()
        .forEach(t => t.stop());

      return;
    }

    stream = newStream;

    $("video").srcObject = stream;
    $("video").hidden = false;

    await $("video").play();

    if (request !== cameraRequest) return;

    $("watermark").hidden = false;

    $("liveInfo").textContent =
      branch + " | " + staff +
      " | " + areas[current];

    $("clock").textContent = getTime();

    $("capture").hidden = false;

    $("status").textContent =
      "Camera đã sẵn sàng.";

  } catch (e) {

    if (request !== cameraRequest) return;

    stopCamera();

    $("retry").hidden = false;

    $("status").textContent =
      "Lỗi camera: " + e.message;

  } finally {

    if (request === cameraRequest) {
      opening = false;
    }

  }

}

function takePhoto() {

  const video = $("video");
  const canvas = $("canvas");

  if (!stream ||
      !video.videoWidth ||
      video.readyState < 2) {

    $("status").textContent =
      "Camera chưa sẵn sàng.";

    return;
  }

  const scale = Math.min(
    1,
    1280 / Math.max(
      video.videoWidth,
      video.videoHeight
    )
  );

  canvas.width =
    Math.round(video.videoWidth * scale);

  canvas.height =
    Math.round(video.videoHeight * scale);

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video, 0, 0,
    canvas.width, canvas.height
  );

  const lines = [
    "PHỞ GÀ ĐỒI",
    "Cơ sở: " + branch,
    "Ngày giờ: " + getTime(),
    "Nhân viên: " + staff,
    "Nghiệm thu: " + areas[current],
    "Mã: " + reportId.slice(0, 8)
  ];

  const size = Math.max(
    14,
    Math.round(canvas.width * 0.026)
  );

  const lineHeight = size * 1.5;
  const padding = size * 0.7;

  const height =
    lineHeight * lines.length +
    padding * 2;

  const y = canvas.height - height;

  ctx.fillStyle = "rgba(0,0,0,0.72)";

  ctx.fillRect(
    0, y,
    canvas.width, height
  );

  ctx.textBaseline = "top";

  lines.forEach((line, i) => {

    ctx.fillStyle =
      i === 0 ? "#f4e5a4" : "#ffffff";

    ctx.font =
      (i === 0 ? "bold " : "") +
      size + "px Arial";

    ctx.fillText(
      line,
      padding,
      y + padding + i * lineHeight,
      canvas.width - padding * 2
    );

  });

  temporaryPhoto =
    canvas.toDataURL("image/jpeg", 0.75);

  stopCamera();

  $("video").hidden = true;
  $("watermark").hidden = true;
  $("capture").hidden = true;
  $("canvas").hidden = false;
  $("review").hidden = false;

  $("status").textContent =
    "Kiểm tra và xác nhận ảnh.";

}

function confirmPhoto() {

  if (!temporaryPhoto) return;

  photos[current] = temporaryPhoto;

  temporaryPhoto = null;

  refresh();

  const next = photos.findIndex(p => !p);

  if (next !== -1) {

    openArea(next);

  } else {

    $("cameraSection").hidden = true;

    $("status").textContent =
      "Đã hoàn thành đầy đủ 8 ảnh.";

    $("finishSection").scrollIntoView({
      behavior: "smooth"
    });

  }

}

function cancelCamera() {

  cameraRequest++;
  opening = false;

  stopCamera();

  temporaryPhoto = null;

  $("cameraSection").hidden = true;

  refresh();

}

function finishReport() {

  if (photos.some(p => !p)) {

    $("status").textContent =
      "Chưa đủ 8 ảnh nghiệm thu.";

    return;
  }

  $("status").textContent =
    "Đã xác nhận 8/8 ảnh. " +
    "Đây là bản thử nghiệm, " +
    "chưa gửi ảnh về máy chủ.";

}

window.addEventListener("pagehide", () => {
  cameraRequest++;
  opening = false;
  stopCamera();
});

window.addEventListener("beforeunload", e => {

  if (photos.some(Boolean)) {

    e.preventDefault();
    e.returnValue = "";

  }

});

</script>

</body>
</html>
