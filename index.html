
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">

<title>Phở Gà Đồi Camera</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px;
  background: #151515;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 550px;
  margin: auto;
}

header {
  background: #941c1c;
  color: #f4e5a4;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
}

h1 {
  margin: 0;
  font-size: 26px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #555;
  border-radius: 8px;
  background: #292929;
  color: white;
  font-size: 16px;
}

.camera {
  position: relative;
  background: black;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 18px;
}

video, canvas {
  width: 100%;
  display: block;
}

[hidden] {
  display: none !important;
}

.watermark {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: rgba(0,0,0,.65);
  font-size: 13px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.brand {
  color: #f4e5a4;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: #941c1c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 12px;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
}

#capture {
  width: 76px;
  height: 76px;
  background: white;
  border: 6px solid #777;
  border-radius: 50%;
}

.controls {
  text-align: center;
}

#status {
  text-align: center;
  line-height: 1.5;
  color: #f4e5a4;
}

</style>
</head>

<body>
<main>

<header>
  <h1>PHỞ GÀ ĐỒI</h1>
  <p>ngon từ gà</p>
  <b>CAMERA NGHIỆM THU V3</b>
</header>

<label>Cơ sở cửa hàng</label>

<select id="branch">
  <option value="">Chọn cơ sở</option>
  <option>28 Võ Chí Công</option>
  <option>An Khánh</option>
</select>

<label>Họ và tên nhân viên</label>

<input id="staff"
 maxlength="60"
 placeholder="Nhập họ và tên">

<label>Khu vực nghiệm thu</label>

<select id="area">
  <option>Khu vực làm phở</option>
  <option>Khu vực bếp</option>
  <option>Tủ bảo quản</option>
  <option>Khu vực khách ngồi</option>
  <option>Nhà vệ sinh</option>
  <option>Khu vực rác</option>
  <option>Điện và gas</option>
  <option>Khóa cửa hàng</option>
</select>

<div class="camera">

  <video id="video"
    autoplay
    playsinline
    muted
    hidden>
  </video>

  <canvas id="canvas" hidden></canvas>

  <div class="watermark" id="watermark" hidden>
    <div class="brand">PHỞ GÀ ĐỒI</div>
    <div id="liveBranch"></div>
    <div id="clock"></div>
    <div id="liveStaff"></div>
    <div id="liveArea"></div>
  </div>

</div>

<button id="start" onclick="startCamera()">
  MỞ CAMERA
</button>

<div class="controls" id="controls" hidden>

  <button id="capture"
    aria-label="Chụp ảnh"
    onclick="takePhoto()"
    disabled>
  </button>

  <p>CHỤP ẢNH NGHIỆM THU</p>

</div>

<button id="retake"
 onclick="startCamera()"
 hidden>
  CHỤP LẠI
</button>

<p id="status" role="status"></p>

</main>

<script>

const $ = id => document.getElementById(id);

let stream = null;

function getTime() {

  return new Intl.DateTimeFormat("vi-VN", {
    timeZone: "Asia/Ho_Chi_Minh",
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).format(new Date());

}

function updateClock() {

  $("clock").textContent = getTime();

  $("liveBranch").textContent =
    "Cơ sở: " + $("branch").value;

  $("liveStaff").textContent =
    "Nhân viên: " + $("staff").value;

  $("liveArea").textContent =
    $("area").value;

}

setInterval(updateClock, 500);

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(t => t.stop());

    stream = null;

  }

  $("video").srcObject = null;

}

function validInfo() {

  return $("branch").value &&
    $("staff").value.trim();

}

async function startCamera() {

  if (!validInfo()) {

    $("status").textContent =
      "Vui lòng chọn cơ sở và nhập tên.";

    return;

  }

  $("start").disabled = true;
  $("retake").disabled = true;
  $("capture").disabled = true;

  try {

    stopCamera();

    if (!navigator.mediaDevices?.getUserMedia) {

      throw new Error(
        "Trình duyệt không hỗ trợ Camera API"
      );

    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        },

        audio: false

      });

    $("video").srcObject = stream;

    $("video").hidden = false;

    await $("video").play();

    $("canvas").hidden = true;
    $("watermark").hidden = false;
    $("controls").hidden = false;
    $("capture").disabled = false;
    $("start").hidden = true;
    $("retake").hidden = true;

    updateClock();

    $("status").textContent =
      "Camera đã sẵn sàng.";

  } catch (e) {

    stopCamera();

    $("video").hidden = true;
    $("watermark").hidden = true;
    $("controls").hidden = true;
    $("start").hidden = false;

    $("status").textContent =
      "Không mở được camera: " + e.message +
      ". Kiểm tra quyền camera hoặc mở bằng Safari/Chrome.";

  } finally {

    $("start").disabled = false;
    $("retake").disabled = false;

  }

}

function takePhoto() {

  if (!validInfo()) {

    $("status").textContent =
      "Thiếu thông tin nhân viên hoặc cơ sở.";

    return;

  }

  const video = $("video");
  const canvas = $("canvas");

  if (!stream || !video.videoWidth ||
      video.readyState < 2) {

    $("status").textContent =
      "Camera chưa sẵn sàng.";

    return;

  }

  const scale = Math.min(
    1,
    1280 / Math.max(
      video.videoWidth,
      video.videoHeight
    )
  );

  canvas.width =
    Math.round(video.videoWidth * scale);

  canvas.height =
    Math.round(video.videoHeight * scale);

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0, 0,
    canvas.width,
    canvas.height
  );

  const lines = [
    "PHỞ GÀ ĐỒI",
    "Cơ sở: " + $("branch").value,
    "Ngày giờ: " + getTime(),
    "Nhân viên: " + $("staff").value.trim(),
    "Nghiệm thu: " + $("area").value
  ];

  const size = Math.max(
    14,
    Math.round(canvas.width * 0.027)
  );

  const lineHeight = size * 1.5;
  const padding = size * 0.7;

  const height =
    lineHeight * lines.length +
    padding * 2;

  const y = canvas.height - height;

  ctx.fillStyle = "rgba(0,0,0,0.72)";

  ctx.fillRect(
    0, y,
    canvas.width,
    height
  );

  ctx.textBaseline = "top";

  lines.forEach((line, i) => {

    ctx.fillStyle =
      i === 0 ? "#f4e5a4" : "#ffffff";

    ctx.font =
      (i === 0 ? "bold " : "") +
      size + "px Arial";

    ctx.fillText(
      line,
      padding,
      y + padding + i * lineHeight,
      canvas.width - padding * 2
    );

  });

  canvas.hidden = false;
  video.hidden = true;

  $("watermark").hidden = true;
  $("controls").hidden = true;
  $("retake").hidden = false;

  stopCamera();

  $("status").textContent =
    "Đã chụp ảnh và đóng dấu ngày giờ thành công.";

}

window.addEventListener("pagehide", stopCamera);

</script>

</body>
</html>
