
<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Phở Gà Đồi - V1.0</title>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 500px;
  margin: auto;
  padding: 16px;
}

header {
  background: #941c1c;
  color: #f4e5a4;
  padding: 24px 12px;
  border-radius: 12px;
  text-align: center;
}

h1 { margin: 0; font-size: 30px; }

h2 {
  color: #f4e5a4;
  font-size: 18px;
}

section {
  background: #242424;
  padding: 18px;
  margin-top: 16px;
  border-radius: 12px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  padding: 13px;
  margin-top: 8px;
  font: 16px Arial;
}

button, .camera-button {
  display: block;
  width: 100%;
  background: #f4e5a4;
  color: #222;
  border: 0;
  border-radius: 8px;
  padding: 16px;
  margin-top: 16px;
  font-size: 16px;
  font-weight: bold;
  text-align: center;
}

button:disabled {
  opacity: .4;
}

#camera {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  overflow: hidden;
}

#preview {
  display: none;
  width: 100%;
  margin-top: 15px;
  border-radius: 8px;
}

#photoStatus, #status {
  text-align: center;
  color: #f4e5a4;
  font-size: 14px;
}

footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  padding: 20px;
}

</style>
</head>

<body>
<main>

<header>
  <h1>PHỞ GÀ ĐỒI</h1>
  <p>ngon từ gà</p>
  HỆ THỐNG QUẢN LÝ VẬN HÀNH
</header>

<form id="reportForm"
method="POST"
action="https://script.google.com/macros/s/AKfycbw_UbTAImQnlFTRWJUft0pa4pODY9Gpmin79EQpnwu_5yjbI6mcitQXQCDQP-Qv04N62g/exec">

<input type="hidden"
name="reportId" id="reportId">

<input type="hidden"
name="photo" id="photo">

<section>

<h2>01. THÔNG TIN CA LÀM VIỆC</h2>

<label>Cơ sở</label>

<select name="branch" required>
  <option value="">-- Chọn cơ sở --</option>
  <option value="28 Võ Chí Công">
    CS1 - 28 Võ Chí Công
  </option>
  <option value="An Khánh">
    CS2 - An Khánh
  </option>
</select>

<label>Họ và tên nhân viên</label>

<input name="staff"
maxlength="60"
placeholder="Nhập họ và tên"
required>

<label>Ca làm việc</label>

<select name="shift" required>
  <option value="">-- Chọn ca --</option>
  <option>Ca sáng</option>
  <option>Ca tối</option>
  <option>Ca đêm</option>
</select>

<label>Ghi chú</label>

<textarea name="note"
maxlength="500"
placeholder="Nội dung kiểm thử"></textarea>

</section>

<section>

<h2>02. HÌNH ẢNH NGHIỆM THU</h2>

<p>Chụp 1 ảnh để kiểm tra hệ thống.</p>

<input
  type="file"
  id="camera"
  accept="image/*"
  capture="environment"
  style="position:static;
         width:100%;
         height:auto;
         opacity:1;
         display:block;
         padding:15px;
         background:#f4e5a4;
         color:#222;">

<p id="cameraLabel">
  📷 Chụp ảnh nghiệm thu
</p>

<img id="preview" alt="Ảnh kiểm thử">

<p id="photoStatus">
  Chưa có ảnh
</p>

</section>

<section>

<button type="submit"
id="submit" disabled>
  GỬI BÁO CÁO
</button>

<p id="status"></p>

</section>

</form>

<footer>
  PHỞ GÀ ĐỒI<br><br>
  V1.0 - Giai đoạn 4
</footer>

</main>

<script>

const form =
  document.getElementById("reportForm");

const camera =
  document.getElementById("camera");

const preview =
  document.getElementById("preview");

const photo =
  document.getElementById("photo");

const submit =
  document.getElementById("submit");

const photoStatus =
  document.getElementById("photoStatus");

const status =
  document.getElementById("status");

let sending = false;
let processing = false;

if (window.crypto?.randomUUID) {

  document.getElementById("reportId").value =
    crypto.randomUUID();

} else {

  status.textContent =
    "Vui lòng sử dụng Safari hoặc Chrome mới.";

}

camera.addEventListener("change", function() {

  const file = camera.files[0];

  if (!file || sending) return;

  processing = true;
  submit.disabled = true;
  photo.value = "";
  preview.style.display = "none";

  photoStatus.textContent =
    "Đang xử lý ảnh...";

  const url = URL.createObjectURL(file);

  const img = new Image();

  img.onload = function() {

    try {

      const maxSize = 1280;

      const ratio = Math.min(
        1,
        maxSize / Math.max(
          img.width,
          img.height
        )
      );

      const canvas =
        document.createElement("canvas");

      canvas.width =
        Math.max(1, Math.round(img.width * ratio));

      canvas.height =
        Math.max(1, Math.round(img.height * ratio));

      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        0, 0, canvas.width, canvas.height
      );

      ctx.drawImage(
        img, 0, 0,
        canvas.width, canvas.height
      );

      let quality = 0.75;

      let data = canvas.toDataURL(
        "image/jpeg", quality
      );

      while (
        data.length > 1500000 &&
        quality > 0.3
      ) {

        quality -= 0.1;

        data = canvas.toDataURL(
          "image/jpeg", quality
        );

      }

      if (
        !data.startsWith("data:image/jpeg;base64,") ||
        data.length > 1500000
      ) {
        throw new Error("Ảnh quá lớn.");
      }

      photo.value = data;

      preview.src = data;
      preview.style.display = "block";

      photoStatus.textContent =
        "✓ Ảnh đã sẵn sàng - " +
        Math.round(data.length * 0.75 / 1024) +
        " KB";

      document.getElementById(
        "cameraLabel"
      ).textContent = "📷 CHỤP LẠI";

      submit.disabled =
        !document.getElementById("reportId").value;

    } catch (error) {

      photoStatus.textContent =
        "Lỗi xử lý ảnh. Vui lòng chụp lại.";

    } finally {

      processing = false;
      URL.revokeObjectURL(url);

    }

  };

  img.onerror = function() {

    processing = false;

    photoStatus.textContent =
      "Không đọc được ảnh. Hãy chụp lại.";

    URL.revokeObjectURL(url);

  };

  img.src = url;

  camera.value = "";

});

form.addEventListener("submit", function(e) {

  if (sending || processing || !photo.value) {

    e.preventDefault();
    return;

  }

  sending = true;

  submit.disabled = true;

  submit.textContent = "ĐANG GỬI...";

  status.textContent =
    "Vui lòng không đóng trang.";

});

window.addEventListener("pageshow", function(e) {

  if (e.persisted && sending) {

    sending = false;

    submit.disabled = !photo.value;

    submit.textContent = "GỬI BÁO CÁO";

    status.textContent =
      "Kiểm tra Telegram trước khi gửi lại.";

  }

});

</script>

</body>
</html>
