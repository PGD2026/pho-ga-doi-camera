
<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Phở Gà Đồi - V1.0</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 500px;
  margin: auto;
  padding: 16px;
}

header {
  background: #941c1c;
  color: #f4e5a4;
  padding: 24px 12px;
  border-radius: 12px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 30px;
}

h2 {
  color: #f4e5a4;
  font-size: 18px;
}

section {
  background: #242424;
  padding: 18px;
  margin-top: 16px;
  border-radius: 12px;
}

label {
  display: block;
  margin-top: 15px;
  font-size: 15px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  padding: 13px;
  margin-top: 8px;
  font: 16px Arial;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  width: 100%;
  background: #f4e5a4;
  color: #222;
  border: 0;
  border-radius: 8px;
  padding: 16px;
  margin-top: 20px;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  padding: 20px;
}

#status {
  color: #f4e5a4;
  text-align: center;
}

</style>

</head>

<body>

<main>

<header>

  <h1>PHỞ GÀ ĐỒI</h1>

  <p>ngon từ gà</p>

  HỆ THỐNG QUẢN LÝ VẬN HÀNH

</header>

<section>

<h2>01. THÔNG TIN CA LÀM VIỆC</h2>

<form

  id="reportForm"

  method="POST"

  action="https://script.google.com/macros/s/AKfycbw_UbTAImQnlFTRWJUft0pa4pODY9Gpmin79EQpnwu_5yjbI6mcitQXQCDQP-Qv04N62g/exec">

  <input
    type="hidden"
    name="reportId"
    id="reportId">

  <label>Cơ sở</label>

  <select name="branch" required>

    <option value="">
      -- Chọn cơ sở --
    </option>

    <option value="28 Võ Chí Công">
      CS1 - 28 Võ Chí Công
    </option>

    <option value="An Khánh">
      CS2 - An Khánh
    </option>

  </select>

  <label>Họ và tên nhân viên</label>

  <input

    name="staff"

    maxlength="60"

    placeholder="Nhập họ và tên"

    required>

  <label>Ca làm việc</label>

  <select name="shift" required>

    <option value="">
      -- Chọn ca làm việc --
    </option>

    <option>Ca sáng</option>

    <option>Ca tối</option>

    <option>Ca đêm</option>

  </select>

  <label>Ghi chú báo cáo</label>

  <textarea

    name="note"

    maxlength="500"

    placeholder="Nhập nội dung kiểm thử...">

  </textarea>

  <button type="submit" id="submit">

    GỬI BÁO CÁO KIỂM THỬ

  </button>

</form>

<p id="status"></p>

</section>

<footer>

  PHỞ GÀ ĐỒI<br><br>

  Hệ thống V1.0 - Giai đoạn 3

</footer>

</main>

<script>

const form =
  document.getElementById("reportForm");

const submit =
  document.getElementById("submit");

const status =
  document.getElementById("status");

let sending = false;

if (window.crypto?.randomUUID) {

  document.getElementById("reportId").value =
    crypto.randomUUID();

} else {

  submit.disabled = true;

  status.textContent =
    "Vui lòng mở bằng Safari hoặc Chrome mới.";

}

form.addEventListener("submit", function(e) {

  if (sending) {

    e.preventDefault();

    return;

  }

  sending = true;

  submit.disabled = true;

  submit.textContent = "ĐANG GỬI...";

  status.textContent =
    "Vui lòng không đóng trang.";

});

window.addEventListener("pageshow", function(e) {

  if (e.persisted && sending) {

    sending = false;

    submit.disabled = false;

    submit.textContent = "GỬI BÁO CÁO KIỂM THỬ";

    status.textContent =
      "Kiểm tra Telegram trước khi gửi lại.";

  }

});

</script>

</body>

</html>
