
<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Phở Gà Đồi - Nghiệm thu cuối ca</title>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #121212;
  color: white;
  font-family: Arial, sans-serif;
}

main {
  max-width: 550px;
  margin: auto;
  padding: 16px;
}

header {
  background: #941c1c;
  color: #f4e5a4;
  padding: 25px 12px;
  border-radius: 12px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 30px;
}

h2 {
  color: #f4e5a4;
  font-size: 18px;
}

section {
  background: #242424;
  padding: 16px;
  margin-top: 16px;
  border-radius: 12px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  background: #333;
  color: white;
  border: 1px solid #666;
  border-radius: 8px;
  padding: 13px;
  margin-top: 8px;
  font: 16px Arial;
}

textarea {
  min-height: 80px;
}

.photo-card {
  background: #303030;
  padding: 14px;
  border: 1px solid #555;
  border-radius: 10px;
  margin-top: 12px;
}

.photo-card.done {
  border-color: #63d991;
}

.photo-title {
  font-size: 16px;
  font-weight: bold;
  line-height: 1.5;
}

.camera-input {
  position: static;
  display: block;
  opacity: 1;
  width: 100%;
  height: auto;
  background: #f4e5a4;
  color: #222;
  padding: 12px;
}

.preview {
  display: none;
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  border-radius: 8px;
  margin-top: 12px;
}

.photo-status {
  font-size: 13px;
  color: #bbb;
  margin-top: 10px;
}

.done .photo-status {
  color: #63d991;
}

.progress {
  background: #444;
  height: 9px;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #63d991;
  transition: width .2s;
}

#progressText {
  color: #f4e5a4;
  font-size: 20px;
  font-weight: bold;
}

.confirm {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  line-height: 1.5;
}

.confirm input {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  margin: 0;
}

button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 17px;
  margin-top: 18px;
  background: #f4e5a4;
  color: #222;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  background: #444;
  color: #aaa;
}

#status {
  text-align: center;
  color: #f4e5a4;
  font-size: 14px;
}

footer {
  text-align: center;
  color: #999;
  font-size: 12px;
  padding: 25px;
}

</style>
</head>

<body>
<main>

<header>
  <h1>PHỞ GÀ ĐỒI</h1>
  <p>ngon từ gà</p>
  NGHIỆM THU CUỐI CA
</header>

<form id="reportForm"
method="POST"
action="https://script.google.com/macros/s/AKfycbw_UbTAImQnlFTRWJUft0pa4pODY9Gpmin79EQpnwu_5yjbI6mcitQXQCDQP-Qv04N62g/exec">

<input type="hidden"
name="payload" id="payload">

<section>

<h2>01. THÔNG TIN NHÂN VIÊN</h2>

<label for="branch">Cơ sở</label>

<select id="branch" required>
  <option value="">-- Chọn cơ sở --</option>
  <option value="28 Võ Chí Công">
    CS1 - 28 Võ Chí Công
  </option>
  <option value="An Khánh">
    CS2 - An Khánh
  </option>
</select>

<label for="staff">Họ và tên nhân viên</label>

<input id="staff"
maxlength="60"
placeholder="Nhập họ và tên"
required>

<label for="shift">Ca làm việc</label>

<select id="shift" required>
  <option value="">-- Chọn ca --</option>
  <option>Ca sáng</option>
  <option>Ca tối</option>
  <option>Ca đêm</option>
</select>

</section>

<div id="inventoryModule"></div>
<section>

<h2>03. HÌNH ẢNH NGHIỆM THU</h2>

<div id="progressText">0/11 ảnh</div>

<div class="progress">
  <div id="progressBar"></div>
</div>

<p>Chụp đủ 11 khu vực theo thứ tự bên dưới.</p>

<div id="photoList"></div>

</section>

<section>

<h2>04. GHI CHÚ VÀ XÁC NHẬN</h2>

<textarea id="note"
maxlength="500"
placeholder="Ghi chú các vấn đề phát sinh...">
</textarea>

<label class="confirm">

<input type="checkbox" id="confirmed">

<span>
Tôi xác nhận đã kiểm tra đầy đủ các khu vực
và chịu trách nhiệm về nội dung báo cáo.
</span>

</label>

<button type="submit"
id="submit" disabled>
  GỬI BÁO CÁO (0/11)
</button>

<p id="status"></p>

</section>

</form>

<footer>
  PHỞ GÀ ĐỒI<br><br>
  V1.0 - Giai đoạn 5 - 11 ảnh
</footer>

</main>

<script>

const AREAS = [
  "Khu vực làm phở",
  "Khu vực điện và gas",
  "Khu vực bếp rửa bát",
  "Tủ lạnh bảo quản",
  "Khu vực giấm + ớt + măng",
  "Khu vực ngoài sân 1",
  "Khu vực ngoài sân 2",
  "Khu vực rác",
  "Đồ đóng gói mang về",
  "Nhà vệ sinh",
  "Khóa cửa hàng"
];

const photos = Array(11).fill(null);

const processing = new Set();

const form =
  document.getElementById("reportForm");

const list =
  document.getElementById("photoList");

const submit =
  document.getElementById("submit");

const confirmed =
  document.getElementById("confirmed");

const status =
  document.getElementById("status");

const branch =
  document.getElementById("branch");

const staff =
  document.getElementById("staff");

const shift =
  document.getElementById("shift");

const reportId = window.crypto?.randomUUID
  ? crypto.randomUUID()
  : "";

let sending = false;


function updateProgress() {

  const count = photos.filter(Boolean).length;

  document.getElementById(
    "progressText"
  ).textContent = count + "/11 ảnh";

  document.getElementById(
    "progressBar"
  ).style.width = (count / 11 * 100) + "%";

  submit.textContent =
    "GỬI BÁO CÁO (" + count + "/11)";

  submit.disabled =

    count !== 11 ||
    processing.size > 0 ||
    !confirmed.checked ||
    !branch.value ||
    !staff.value.trim() ||
    !shift.value ||
    !reportId ||
    sending;

}


AREAS.forEach(function(area, i) {

  const card = document.createElement("div");

  card.className = "photo-card";

  card.id = "card" + i;

  card.innerHTML = `

    <div class="photo-title">
      ${String(i + 1).padStart(2, "0")}.
      ${area}
    </div>

    <input type="file"
      class="camera-input"
      id="camera${i}"
      accept="image/*"
      capture="environment">

    <img class="preview"
      id="preview${i}"
      alt="${area}">

    <div class="photo-status"
      id="photoStatus${i}">
      Chưa có ảnh
    </div>

  `;

  list.appendChild(card);

  const input = document.getElementById(
    "camera" + i
  );

  input.addEventListener("change", function() {

    if (input.files[0]) {
      processPhoto(input.files[0], i);
    }

    input.value = "";

  });

});


function processPhoto(file, i) {

  if (processing.has(i) || sending) return;

  if (!branch.value) {

    alert("Vui lòng chọn cơ sở trước khi chụp.");

    return;

  }

  const selectedBranch = branch.value;

  const input = document.getElementById(
    "camera" + i
  );

  const card = document.getElementById(
    "card" + i
  );

  const preview = document.getElementById(
    "preview" + i
  );

  const photoStatus = document.getElementById(
    "photoStatus" + i
  );

  processing.add(i);

  input.disabled = true;
  branch.disabled = true;

  photos[i] = null;

  card.classList.remove("done");

  preview.style.display = "none";

  photoStatus.textContent = "Đang xử lý ảnh...";

  updateProgress();

  const url = URL.createObjectURL(file);

  const img = new Image();

  function finish() {

    processing.delete(i);

    input.disabled = false;

    branch.disabled = processing.size > 0;

    URL.revokeObjectURL(url);

    updateProgress();

  }

  img.onload = function() {

    try {

      const maxSize = 1100;

      const ratio = Math.min(
        1,
        maxSize / Math.max(
          img.width, img.height
        )
      );

      const canvas =
        document.createElement("canvas");

      canvas.width = Math.max(
        1, Math.round(img.width * ratio)
      );

      const imageHeight = Math.max(
        1, Math.round(img.height * ratio)
      );

      const stampHeight = Math.max(
        90, Math.round(canvas.width * 0.14)
      );

      canvas.height = imageHeight + stampHeight;

      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";

      ctx.fillRect(
        0, 0, canvas.width, canvas.height
      );

      ctx.drawImage(
        img, 0, 0, canvas.width, imageHeight
      );

      const time = new Date().toLocaleString(
        "vi-VN",
        { timeZone: "Asia/Ho_Chi_Minh" }
      );

      ctx.fillStyle = "#151515";

      ctx.fillRect(
        0, imageHeight,
        canvas.width, stampHeight
      );

      ctx.fillStyle = "#f4e5a4";

      const fontSize = Math.max(
        10, Math.round(canvas.width * 0.029)
      );

      ctx.font = "bold " + fontSize + "px Arial";

      ctx.fillText(
        "PHỞ GÀ ĐỒI - " + selectedBranch,
        10,
        imageHeight + stampHeight * 0.25,
        canvas.width - 20
      );

      ctx.fillStyle = "#ffffff";

      ctx.fillText(
        (i + 1) + ". " + AREAS[i],
        10,
        imageHeight + stampHeight * 0.52,
        canvas.width - 20
      );

      ctx.fillText(
        "Xử lý ảnh: " + time,
        10,
        imageHeight + stampHeight * 0.8,
        canvas.width - 20
      );

      let quality = 0.72;

      let data = canvas.toDataURL(
        "image/jpeg", quality
      );

      while (
        data.length > 650000 &&
        quality > 0.3
      ) {

        quality -= 0.08;

        data = canvas.toDataURL(
          "image/jpeg", quality
        );

      }

      if (
        !data.startsWith("data:image/jpeg;base64,") ||
        data.length > 650000
      ) {

        throw new Error("Ảnh quá lớn.");

      }

      photos[i] = {
        data: data
      };

      preview.src = data;

      preview.style.display = "block";

      card.classList.add("done");

      photoStatus.textContent =
        "✓ Đã có ảnh - Có thể chụp lại";

    } catch (error) {

      photoStatus.textContent =
        "Lỗi xử lý ảnh. Vui lòng chụp lại.";

    } finally {

      finish();

    }

  };

  img.onerror = function() {

    photoStatus.textContent =
      "Không đọc được ảnh. Hãy chụp lại.";

    finish();

  };

  img.src = url;

}


branch.addEventListener("change", function() {

  if (photos.some(Boolean)) {

    photos.fill(null);

    AREAS.forEach(function(_, i) {

      document.getElementById(
        "preview" + i
      ).style.display = "none";

      document.getElementById(
        "card" + i
      ).classList.remove("done");

      document.getElementById(
        "photoStatus" + i
      ).textContent = "Chưa có ảnh";

    });

    confirmed.checked = false;

    alert(
      "Đã đổi cơ sở. Vui lòng chụp lại ảnh."
    );

  }

  updateProgress();

});


staff.addEventListener("input", updateProgress);

shift.addEventListener("change", updateProgress);

confirmed.addEventListener(
  "change", updateProgress
);


form.addEventListener("submit", function(e) {

  if (
    sending ||
    processing.size ||
    photos.filter(Boolean).length !== 11 ||
    !confirmed.checked ||
    !reportId ||
    !branch.value ||
    !staff.value.trim() ||
    !shift.value
  ) {

    e.preventDefault();

    return;

  }

  const data = {

    reportId: reportId,

    branch: branch.value,

    staff: staff.value.trim(),

    shift: shift.value,

    note: document.getElementById("note")
      .value.trim(),

    confirmed: true,

    photos: photos

  };

  document.getElementById("payload").value =
    JSON.stringify(data);

  sending = true;

  submit.disabled = true;

  submit.textContent = "ĐANG GỬI 11 ẢNH...";

  status.textContent =
    "Vui lòng chờ, không đóng hoặc tải lại trang.";

});


window.addEventListener("pageshow", function(e) {

  if (e.persisted && sending) {

    sending = false;

    updateProgress();

    status.textContent =
      "Kiểm tra báo cáo cũ trước khi gửi lại.";

  }

});


if (!reportId) {

  status.textContent =
    "Vui lòng sử dụng Safari hoặc Chrome mới.";

}

updateProgress();

</script>

</body>
</html>
